<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c9e6fb">
  <meta name="description" content="HARU 회원가입 — 카카오, 네이버, Google 계정으로 간편 가입">
  <title>회원가입 — HARU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <script src="nav.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body data-auth-mode="signup">
  <header class="site-header shell">
    <a class="wordmark" href="index.html" aria-label="HARU 홈">HARU</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="메뉴 열기"><i></i><i></i></button>
    <nav id="main-nav" class="main-nav" aria-label="주 메뉴">
      <a href="index.html#products">제품</a><a href="index.html#recommend">맞춤 추천</a><a href="index.html#routine">정기구독</a><a href="index.html#consult">상담</a><a class="nav-mobile-only" href="login.html">로그인</a><a class="nav-mobile-only" href="signup.html">회원가입</a>
    </nav>
    <div class="header-actions"><a href="login.html">로그인</a><a href="signup.html" aria-current="page">회원가입</a><a class="outline-button" href="index.html#products">구매하기 <span>↗</span></a></div>
  </header>

  <main class="auth-main shell">
    <section class="auth-card" aria-labelledby="auth-title">
      <span class="eyebrow">JOIN HARU</span>
      <h1 id="auth-title">회원가입</h1>
      <p class="auth-lead">3초 만에 가입하고 하루 루틴을 시작하세요</p>

      <p class="auth-perk"><b>10%</b><span>가입 즉시 <strong>첫 구매 할인 쿠폰</strong>이 발급돼요</span></p>

      <fieldset class="terms">
        <legend>약관 동의</legend>
        <label class="all"><input type="checkbox" data-terms-all> 전체 동의하기</label>
        <label><input type="checkbox" data-terms-item required> <span><em>[필수]</em> 이용약관 동의</span></label>
        <label><input type="checkbox" data-terms-item required> <span><em>[필수]</em> 개인정보 수집 및 이용 동의</span></label>
        <label><input type="checkbox" data-terms-item required> <span><em>[필수]</em> 만 14세 이상입니다</span></label>
        <label><input type="checkbox" data-terms-item> <span>[선택] 쿠폰 · 이벤트 소식 받기 <small>(이메일, 카카오톡)</small></span></label>
      </fieldset>

      <div class="social-list">
        <button class="social-btn kakao" type="button" data-provider="kakao">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.48 3 2 6.54 2 10.9c0 2.8 1.86 5.27 4.66 6.67l-.95 3.48c-.08.3.26.54.52.37l4.13-2.74c.54.07 1.08.11 1.64.11 5.52 0 10-3.54 10-7.9S17.52 3 12 3z"/></svg>
          카카오로 가입하기
        </button>
        <button class="social-btn naver" type="button" data-provider="naver">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M15.3 12.6 8.4 3H3v18h5.7v-9.6l6.9 9.6H21V3h-5.7z"/></svg>
          네이버로 가입하기
        </button>
        <button class="social-btn google" type="button" data-provider="google">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Google로 가입하기
        </button>
      </div>

      <div class="auth-divider">이미 회원이신가요?</div>
      <p class="auth-switch">가입한 계정으로 바로 들어가세요<a href="login.html">로그인</a></p>
      <p class="auth-note">본 사이트는 프로토타입으로 가상 브랜드이며, 실제 계정 정보는 저장되지 않습니다.</p>
    </section>
  </main>

  <footer class="auth-footer">© 2026 HARU Wellness. All rights reserved.</footer>
  <div class="auth-toast" role="status" aria-live="polite"></div>
</body>
</html>
